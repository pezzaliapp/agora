name: Aggiorna notizie

on:
  schedule:
    - cron: "*/20 * * * *"   # ogni 20 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recupera i dati precedenti (ramo "data")
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Scarica i feed
        env:
          # a mano: aggiorna tutte le località; in automatico: 80 per giro, a rotazione
          LOCAL_MAX: ${{ github.event_name == 'workflow_dispatch' && '999' || '80' }}
        run: node scripts/fetch-news.mjs out

      - name: Pubblica sul ramo "data" (sovrascritto ogni volta, la repo non cresce)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Notizie $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
