name: Aggiorna notizie

on:
  schedule:
    - cron: "*/20 * * * *"   # ogni 20 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scarica i feed
        run: node scripts/fetch-news.mjs

      - name: Pubblica se ci sono novità
        run: |
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Notizie aggiornate $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
